$kind: http-request
name: 'Buscar Atendimento por ID'
method: GET
url: '{{base_url}}/atendimentos/{{atendimento_id}}'
order: 4000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 - OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Retorna o atendimento correto", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("id");
          pm.expect(json.id).to.be.a("number");
      });

      pm.test("Campos obrigatórios presentes", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("consultaId");
          pm.expect(json).to.have.property("pacienteId");
          pm.expect(json).to.have.property("medicoId");
          pm.expect(json).to.have.property("status");
      });
