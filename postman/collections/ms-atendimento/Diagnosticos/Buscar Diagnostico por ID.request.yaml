$kind: http-request
name: 'Buscar Diagnóstico por ID'
method: GET
url: '{{base_url}}/diagnosticos/{{diagnostico_id}}'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 - OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Retorna o diagnóstico correto", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("id");
          pm.expect(json).to.have.property("codigoCid10");
          pm.expect(json).to.have.property("descricao");
          pm.expect(json).to.have.property("tipo");
      });
