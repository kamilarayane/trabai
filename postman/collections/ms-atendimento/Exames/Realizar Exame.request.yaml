$kind: http-request
name: 'Realizar Exame'
method: PATCH
url: '{{base_url}}/exames/{{exame_id}}/realizar'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 - OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Status do exame é REALIZADO", function () {
          const json = pm.response.json();
          pm.expect(json.status).to.eql("REALIZADO");
      });

      pm.test("ID do exame está presente", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("id");
      });
