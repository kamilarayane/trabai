server.port=8080
spring.application.name=ms-atendimento

# Credenciais via variáveis de ambiente (nunca versionar senha)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_atendimento}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
