$kind: http-request
name: 'Finalizar Atendimento'
method: PATCH
url: '{{base_url}}/atendimentos/{{atendimento_id}}/finalizar'
order: 5000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 - OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Status do atendimento é FINALIZADO", function () {
          const json = pm.response.json();
          pm.expect(json.status).to.eql("FINALIZADO");
      });

      pm.test("Campo 'fim' foi preenchido", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("fim");
          pm.expect(json.fim).to.not.be.null;
      });
