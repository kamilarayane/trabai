$kind: http-request
name: 'Buscar Prontuário por ID'
method: GET
url: '{{base_url}}/prontuarios/{{prontuario_id}}'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 - OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Retorna o prontuário correto", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("id");
          pm.expect(json).to.have.property("pacienteId");
      });
